<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Icom Custom Firmware logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c70c4"/>
      <stop offset="100%" stop-color="#1b467e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8cc4ff"/>
      <stop offset="100%" stop-color="#58c27d"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="7" y="7" width="114" height="114" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Subtle RF grid baseline -->
  <line x1="20" y1="92" x2="108" y2="92" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="76" x2="108" y2="76" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Stylized M / spectrum peak glyph (evolved from original favicon) -->
  <path d="M26 88 V44 H39 L64 74 L89 44 H102 V88" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Microwave / transverter RF arcs -->
  <path d="M52 33 A22 22 0 0 1 76 33" fill="none" stroke="url(#wave)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M42 24 A34 34 0 0 1 86 24" fill="none" stroke="url(#wave)" stroke-opacity="0.72" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Verified build indicator dot -->
  <circle cx="98" cy="98" r="7" fill="#58c27d" stroke="#1b467e" stroke-width="2.5"/>
</svg>
