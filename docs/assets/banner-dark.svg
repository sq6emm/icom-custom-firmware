<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Icom Custom Firmware for IC-705 and IC-9700">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111418"/>
      <stop offset="100%" stop-color="#1a222d"/>
    </linearGradient>
    <linearGradient id="badgeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f75cc"/>
      <stop offset="100%" stop-color="#1b467e"/>
    </linearGradient>
    <linearGradient id="traceDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ea8f0"/>
      <stop offset="65%" stop-color="#8cc4ff"/>
      <stop offset="100%" stop-color="#58c27d"/>
    </linearGradient>
    <linearGradient id="fillDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ea8f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6ea8f0" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="2" y="2" width="1276" height="316" rx="18" fill="url(#bgDark)" stroke="#2e3640" stroke-width="2"/>

  <!-- Decorative subtle grid on right -->
  <g stroke="#6ea8f0" stroke-opacity="0.08" stroke-width="1">
    <line x1="840" y1="36" x2="1240" y2="36"/>
    <line x1="840" y1="84" x2="1240" y2="84"/>
    <line x1="840" y1="132" x2="1240" y2="132"/>
    <line x1="840" y1="180" x2="1240" y2="180"/>
    <line x1="840" y1="228" x2="1240" y2="228"/>
    <line x1="885" y1="36" x2="885" y2="274"/>
    <line x1="965" y1="36" x2="965" y2="274"/>
    <line x1="1045" y1="36" x2="1045" y2="274"/>
    <line x1="1125" y1="36" x2="1125" y2="274"/>
    <line x1="1205" y1="36" x2="1205" y2="274"/>
  </g>

  <!-- Logo emblem -->
  <g transform="translate(46, 52)">
    <rect x="0" y="0" width="108" height="108" rx="22" fill="url(#badgeDark)"/>
    <rect x="3" y="3" width="102" height="102" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <line x1="18" y1="78" x2="90" y2="78" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 74 V37 H33 L54 62 L75 37 H86 V74" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 27 A18 18 0 0 1 64 27" fill="none" stroke="#8cc4ff" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M35 19 A28 28 0 0 1 73 19" fill="none" stroke="#58c27d" stroke-opacity="0.92" stroke-width="3" stroke-linecap="round"/>
    <circle cx="83" cy="83" r="6" fill="#58c27d" stroke="#1b467e" stroke-width="2"/>
  </g>

  <!-- Title and subtitle (kept cleanly left of x=830) -->
  <text x="178" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6e9ed" letter-spacing="-0.5">Icom Custom Firmware</text>
  <text x="178" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="600" fill="#6ea8f0">IC-705 (E/J) &amp; IC-9700 (E) : Transverter, Scope &amp; ICAP</text>
  <text x="178" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa4b1">Zero Icom binaries distributed. Build byte-identical .dat firmware</text>
  <text x="178" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa4b1">locally in your browser or with the Python CLI, verified by MD5.</text>

  <!-- Feature pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600">
    <rect x="46" y="220" width="184" height="36" rx="18" fill="#1b2a3d" stroke="#355276" stroke-width="1.2"/>
    <text x="138" y="243" text-anchor="middle" fill="#8cc4ff">TRV1-TRV8 / 122 GHz</text>

    <rect x="244" y="220" width="214" height="36" rx="18" fill="#1b2a3d" stroke="#355276" stroke-width="1.2"/>
    <text x="351" y="243" text-anchor="middle" fill="#8cc4ff">FT8 Q65 JT4 PI4 WSPR</text>

    <rect x="472" y="220" width="134" height="36" rx="18" fill="#14271b" stroke="#2c5d3c" stroke-width="1.2"/>
    <text x="539" y="243" text-anchor="middle" fill="#58c27d">APRS 1200 Bd</text>

    <rect x="620" y="220" width="168" height="36" rx="18" fill="#14271b" stroke="#2c5d3c" stroke-width="1.2"/>
    <text x="704" y="243" text-anchor="middle" fill="#58c27d">A/B Bootloader</text>
  </g>

  <!-- Right panel: Scope / Waterfall preview -->
  <g transform="translate(856, 46)">
    <rect x="0" y="0" width="380" height="228" rx="14" fill="#141920" stroke="#2e3640" stroke-width="1.5"/>
    <rect x="14" y="14" width="352" height="32" rx="8" fill="#1d242e"/>
    <circle cx="32" cy="30" r="5" fill="#58c27d"/>
    <text x="46" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e6e9ed">10,368.100 MHz  TRV1  1 dB/div</text>

    <!-- Spectrum curve -->
    <path d="M18 158 L42 155 L64 159 L88 152 L108 157 L128 148 L146 155 L164 112 L176 70 L188 116 L208 152 L234 156 L258 146 L276 154 L300 130 L312 98 L324 136 L344 156 L362 154 L362 176 L18 176 Z" fill="url(#fillDark)"/>
    <path d="M18 158 L42 155 L64 159 L88 152 L108 157 L128 148 L146 155 L164 112 L176 70 L188 116 L208 152 L234 156 L258 146 L276 154 L300 130 L312 98 L324 136 L344 156 L362 154" fill="none" stroke="url(#traceDark)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Peak marker -->
    <circle cx="176" cy="70" r="4.5" fill="#58c27d"/>
    <text x="188" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#58c27d">Q65 / CW</text>

    <!-- Waterfall bars -->
    <rect x="18" y="186" width="344" height="8" rx="3" fill="#1e2938"/>
    <rect x="166" y="186" width="20" height="8" rx="2" fill="#6ea8f0"/>
    <rect x="304" y="186" width="16" height="8" rx="2" fill="#58c27d"/>
    <rect x="18" y="200" width="344" height="8" rx="3" fill="#1a222d"/>
    <rect x="164" y="200" width="24" height="8" rx="2" fill="#8cc4ff"/>
    <rect x="302" y="200" width="20" height="8" rx="2" fill="#58c27d"/>
  </g>
</svg>
